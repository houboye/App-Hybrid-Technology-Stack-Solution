<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebView Detail</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 20px;
            background: #f8f9fa;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .badge { font-size: 28px; font-weight: bold; color: #FF9800; }
        .title { font-size: 22px; font-weight: 600; margin-top: 8px; }
        .params { font-size: 16px; color: #666; margin-top: 8px; margin-bottom: 24px; }
        .btn {
            display: block;
            width: 80%;
            max-width: 300px;
            padding: 14px;
            margin-bottom: 12px;
            background: #FF9800;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        .btn:active { opacity: 0.7; }
        .btn-outlined {
            background: transparent;
            color: #FF9800;
            border: 1px solid #FF9800;
        }
    </style>
</head>
<body>
    <div class="badge">🌐 WebView</div>
    <div class="title">Detail Page</div>
    <div class="params" id="params-display">Loading params...</div>

    <button class="btn" onclick="AppRouter.navigate('app://native/home')">Go to Native Home</button>
    <button class="btn btn-outlined" onclick="AppRouter.navigate('app://rn/home')">Open React Native</button>
    <button class="btn btn-outlined" onclick="AppRouter.navigate('app://flutter/home')">Open Flutter</button>

    <script src="../js/bridge.js"></script>
    <script>
        // Parse and display URL parameters
        var params = {};
        var search = window.location.search.substring(1);
        if (search) {
            search.split('&').forEach(function(pair) {
                var parts = pair.split('=');
                params[decodeURIComponent(parts[0])] = decodeURIComponent(parts[1] || '');
            });
        }
        document.getElementById('params-display').textContent =
            Object.keys(params).length > 0
                ? 'Params: ' + JSON.stringify(params)
                : 'No params';
    </script>
</body>
</html>
