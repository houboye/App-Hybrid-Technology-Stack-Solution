<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebView Home</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 20px;
            background: #f8f9fa;
            color: #333;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .badge {
            font-size: 28px;
            font-weight: bold;
            color: #FF9800;
        }
        .subtitle {
            font-size: 18px;
            color: #666;
            margin-top: 4px;
        }
        .section {
            margin-bottom: 24px;
        }
        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin-bottom: 8px;
            background: #FF9800;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:active { opacity: 0.7; }
        .btn-outlined {
            background: transparent;
            color: #FF9800;
            border: 1px solid #FF9800;
        }
        .response {
            font-size: 12px;
            color: #4CAF50;
            margin: 4px 0;
        }
        #event-log {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px;
            min-height: 100px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 11px;
            line-height: 1.6;
        }
        .log-empty { color: #999; font-style: italic; }
        .log-entry { border-bottom: 1px solid #f0f0f0; padding: 2px 0; }
    </style>
</head>
<body>
    <div class="header">
        <div class="badge">🌐 WebView</div>
        <div class="subtitle">Home Page</div>
    </div>

    <div class="section">
        <div class="section-title">Navigation</div>
        <button class="btn" onclick="AppRouter.navigate('app://native/demo')">Navigate to Native Demo</button>
        <button class="btn" onclick="AppRouter.navigate('app://rn/home')">Navigate to React Native</button>
        <button class="btn" onclick="AppRouter.navigate('app://flutter/home')">Navigate to Flutter</button>
        <button class="btn" onclick="AppRouter.navigate('app://webview?url=local://webDetail.html')">Navigate to Web Detail</button>
    </div>

    <div class="section">
        <div class="section-title">Communication</div>
        <button class="btn btn-outlined" onclick="sendRequestToNative()">Send Request to Native</button>
        <div id="response-text" class="response"></div>
        <button class="btn btn-outlined" onclick="broadcastGreeting()">Broadcast Greeting</button>
        <button class="btn btn-outlined" onclick="notifyNative()">Send Notification to Native</button>
    </div>

    <div class="section">
        <div class="section-title">Event Log</div>
        <div id="event-log">
            <span class="log-empty">No events yet...</span>
        </div>
    </div>

    <script src="../js/bridge.js"></script>
    <script src="../js/router.js"></script>
    <script>
        var logInitialized = false;

        function appendLog(text) {
            var log = document.getElementById('event-log');
            if (!logInitialized) {
                log.innerHTML = '';
                logInitialized = true;
            }
            var entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.textContent = new Date().toLocaleTimeString() + ' - ' + text;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        function sendRequestToNative() {
            AppEventBus.sendRequest('native', 'getUserInfo', { userId: '42' })
                .then(function(response) {
                    document.getElementById('response-text').textContent =
                        'Response: ' + JSON.stringify(response.payload);
                    appendLog('Got response: ' + JSON.stringify(response.payload));
                });
            appendLog('Sent request: getUserInfo');
        }

        function broadcastGreeting() {
            AppEventBus.broadcast('greeting', { message: 'Hello from WebView!' });
            appendLog('Sent broadcast: greeting');
        }

        function notifyNative() {
            AppEventBus.sendNotification('native', 'analytics', {
                event: 'page_view',
                page: 'webHome'
            });
            appendLog('Sent notification: analytics');
        }

        // Subscribe to all events
        AppEventBus.subscribe('*', function(msg) {
            appendLog('[' + msg.source + '] ' + msg.channel + ': ' + JSON.stringify(msg.payload));
        });
    </script>
</body>
</html>
