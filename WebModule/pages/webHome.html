<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebView Home</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 20px;
            background: #f8f9fa;
            color: #333;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .badge {
            font-size: 28px;
            font-weight: bold;
            color: #FF9800;
        }
        .subtitle {
            font-size: 18px;
            color: #666;
            margin-top: 4px;
        }
        .section {
            margin-bottom: 24px;
        }
        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin-bottom: 8px;
            background: #FF9800;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:active { opacity: 0.7; }
        .btn-outlined {
            background: transparent;
            color: #FF9800;
            border: 1px solid #FF9800;
        }
        .btn-blue { background: #2196F3; }
        .btn-cyan { background: #61DAFB; color: #000; }
        .btn-green { background: #4CAF50; }
        .btn-red {
            background: transparent;
            color: #F44336;
            border: 1px solid #F44336;
        }
        .btn-purple {
            background: transparent;
            color: #9C27B0;
            border: 1px solid #9C27B0;
        }
        .response {
            font-size: 12px;
            color: #4CAF50;
            margin: 4px 0;
        }
        .data-box {
            background: #FFF3E0;
            border-left: 4px solid #FF9800;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
        }
        .data-title {
            font-size: 14px;
            font-weight: 600;
            color: #E65100;
            margin-bottom: 4px;
        }
        .data-text {
            font-size: 11px;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .divider {
            height: 1px;
            background: #e0e0e0;
            margin: 8px 0;
        }
        #event-log {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px;
            min-height: 100px;
            max-height: 250px;
            overflow-y: auto;
            font-size: 11px;
            line-height: 1.6;
        }
        .log-empty { color: #999; font-style: italic; }
        .log-entry { border-bottom: 1px solid #f0f0f0; padding: 2px 0; }
    </style>
</head>
<body>
    <div class="header">
        <div class="badge">🌐 WebView</div>
        <div class="subtitle">All Communication Flows</div>
    </div>

    <!-- Received PageData -->
    <div id="received-data" style="display:none" class="data-box">
        <div class="data-title">Received PageData:</div>
        <div id="data-content" class="data-text"></div>
    </div>

    <!-- EventBus Communication -->
    <div class="section">
        <div class="section-title">EventBus Communication</div>
        <button class="btn btn-outlined" onclick="sendRequestToNative()">Send Request to Native</button>
        <div id="response-text" class="response"></div>
        <button class="btn btn-outlined" onclick="broadcastGreeting()">Broadcast Greeting</button>
        <button class="btn btn-outlined" onclick="notifyNative()">Send Notification to Native</button>
    </div>

    <!-- PageData Transfer -->
    <div class="section">
        <div class="section-title">PageData Transfer</div>
        <button class="btn btn-cyan" onclick="navigateToRNWithData()">Navigate to RN with Data</button>
        <button class="btn btn-blue" onclick="navigateToFlutterWithData()">Navigate to Flutter with Data</button>
        <button class="btn btn-green" onclick="navigateToNativeWithData()">Navigate to Native with Data</button>
    </div>

    <!-- Navigation Control -->
    <div class="section">
        <div class="section-title">Navigation Control</div>
        <button class="btn" onclick="AppRouter.navigate('app://native/demo')">Open Native Demo</button>
        <button class="btn" onclick="AppRouter.navigate('app://rn/home')">Open React Native</button>
        <button class="btn" onclick="AppRouter.navigate('app://flutter/home')">Open Flutter</button>
        <div class="divider"></div>
        <button class="btn btn-red" onclick="removeRNPage()">Remove RN from Stack</button>
        <button class="btn btn-red" onclick="removeFlutterPage()">Remove Flutter from Stack</button>
        <button class="btn btn-purple" onclick="popWithResult()">Pop with Result Data</button>
    </div>

    <!-- Event Log -->
    <div class="section">
        <div class="section-title">Event Log</div>
        <div id="event-log">
            <span class="log-empty">No events yet...</span>
        </div>
    </div>

    <script src="../js/bridge.js"></script>
    <script src="../js/router.js"></script>
    <script src="../js/page-data.js"></script>
    <script>
        var logInitialized = false;

        function appendLog(text) {
            var log = document.getElementById('event-log');
            if (!logInitialized) {
                log.innerHTML = '';
                logInitialized = true;
            }
            var entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.textContent = new Date().toLocaleTimeString() + ' ' + text;
            log.appendChild(entry);
            if (log.children.length > 30) log.removeChild(log.firstChild);
            log.scrollTop = log.scrollHeight;
        }

        // === Auto-consume PageData from URL ===
        PageData.getFromURL().then(function(entry) {
            if (entry) {
                document.getElementById('received-data').style.display = 'block';
                document.getElementById('data-content').textContent = JSON.stringify(entry.data, null, 2);
                appendLog('[PageData] Received from ' + entry.source + ': ' + JSON.stringify(entry.data));
            }
        });

        // === EventBus Handlers ===
        function sendRequestToNative() {
            AppEventBus.sendRequest('native', 'getUserInfo', { userId: '42' })
                .then(function(response) {
                    document.getElementById('response-text').textContent =
                        'Response: ' + JSON.stringify(response.payload);
                    appendLog('[EventBus] Got response: ' + JSON.stringify(response.payload));
                });
            appendLog('[EventBus] Sent request: getUserInfo');
        }

        function broadcastGreeting() {
            AppEventBus.broadcast('greeting', { message: 'Hello from WebView!' });
            appendLog('[EventBus] Broadcast: greeting');
        }

        function notifyNative() {
            AppEventBus.sendNotification('native', 'analytics', {
                event: 'page_view',
                page: 'webHome'
            });
            appendLog('[EventBus] Notification: analytics');
        }

        // === PageData Transfer ===
        function navigateToRNWithData() {
            PageData.navigateWithData('app://rn/home', {
                webFormData: { name: 'Web User', email: 'web@example.com' },
                selections: ['option1', 'option3'],
                source: 'WebView'
            }).then(function() {
                appendLog('[PageData] Navigate to RN with form data');
            });
        }

        function navigateToFlutterWithData() {
            PageData.navigateWithData('app://flutter/home', {
                chartData: { labels: ['Jan', 'Feb', 'Mar'], values: [30, 50, 80] },
                title: 'Monthly Report',
                source: 'WebView'
            }).then(function() {
                appendLog('[PageData] Navigate to Flutter with chart data');
            });
        }

        function navigateToNativeWithData() {
            PageData.navigateWithData('app://native/demo', {
                notification: { type: 'alert', message: 'Task completed', priority: 'high' },
                source: 'WebView'
            }).then(function() {
                appendLog('[PageData] Navigate to Native with notification');
            });
        }

        // === Navigation Control ===
        function removeRNPage() {
            AppRouter.removePage('app://rn/home');
            appendLog('[Router] removePage: app://rn/home');
        }

        function removeFlutterPage() {
            AppRouter.removePage('app://flutter/home');
            appendLog('[Router] removePage: app://flutter/home');
        }

        function popWithResult() {
            // Broadcast result before navigating back
            AppEventBus.broadcast('pageResult', {
                status: 'done',
                selectedColor: '#FF9800',
                from: 'WebView'
            });
            AppRouter.pop();
        }

        // === Subscribe to all events ===
        AppEventBus.subscribe('*', function(msg) {
            if (msg.channel === 'navigationLifecycle') {
                appendLog('[Lifecycle] ' + msg.payload.event + ': ' + msg.payload.route);
            } else {
                appendLog('[EventBus] [' + msg.source + '] ' + msg.channel + ': ' + JSON.stringify(msg.payload));
            }
        });

        // === Navigation Lifecycle Listeners ===
        AppRouter.onNavigationEvent('*', function(info) {
            appendLog('[Nav] ' + info.event + ': ' + info.route);
        });
    </script>
</body>
</html>
